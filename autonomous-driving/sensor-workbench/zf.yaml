apiVersion: zaofu.dev/v1
kind: ConfigProfile
metadata:
  name: flow-project-runtime/v1
spec:
  runtime:
    workdirs:
      enabled: true
      mode: worktree
    run_manager:
      backend: codex
      resident_agent:
        enabled: true
        model: gpt-5.6-luna
        model_reasoning_effort: high
        session_mode: dedicated
    autoresearch_resident:
      enabled: false
      interval_seconds: 10
      max_actions_per_tick: 1
    feishu_inbound:
      enabled: ${ZF_FEISHU_INBOUND_ENABLED:-false}
      mode: bridge
      require_routing: true
  workflow:
    candidate_quality_source: task_contract_required
    rework_routing: {}
    work_units:
      enabled: true
      split_quality:
        mode: blocking
        max_acceptance_criteria: 8
  flow_defaults:
    issue:
      roleSkillBundles:
        issue-triage:
        - debugging-triage
        - source-verification
        - zf-workflow-adaptation-boundary
        - zf-project-adapter-matrix-enrichment
        - zf-issue-plan-synth
        - zf-yoke-planner-role-context
        plan-critic:
        - zf-workflow-adaptation-boundary
        - zf-yoke-critic-role-context
        discovery:
        - zf-verify-rescan-replan
        - zf-goal-closure-replan-contract
        - zf-yoke-test-evaluator-role-context
        judge-issue:
        - zf-goal-closure-judge-contract
        fix:
        - zf-yoke-dev-worker-role-context
        verify:
        - zf-workflow-adaptation-boundary
        - zf-project-adapter-matrix-enrichment
        - zf-yoke-test-evaluator-role-context
    prd:
      roleSkillBundles:
        scan:
        - source-verification
        - context-hygiene
        - zf-workflow-adaptation-boundary
        - zf-project-adapter-matrix-enrichment
        - zf-prd-plan-synth
        - zf-yoke-planner-role-context
        planner:
        - zf-workflow-adaptation-boundary
        - zf-project-adapter-matrix-enrichment
        - zf-prd-plan-synth
        - zf-yoke-planner-role-context
        plan-critic:
        - zf-workflow-adaptation-boundary
        - zf-yoke-critic-role-context
        discovery:
        - zf-verify-rescan-replan
        - zf-goal-closure-replan-contract
        - zf-yoke-test-evaluator-role-context
        judge-prd:
        - zf-goal-closure-judge-contract
        impl:
        - zf-yoke-dev-worker-role-context
        verify:
        - zf-workflow-adaptation-boundary
        - zf-project-adapter-matrix-enrichment
        - zf-yoke-test-evaluator-role-context
    refactor:
      roleSkillBundles:
        scan-contract:
        - source-verification
        - context-hygiene
        - zf-workflow-adaptation-boundary
        - zf-project-adapter-matrix-enrichment
        - zf-refactor-plan-synth
        - zf-harness-spec-freeze-contract
        - zf-harness-evidence-collection
        - zf-yoke-planner-role-context
        scan-runtime:
        - source-verification
        - context-hygiene
        - zf-harness-evidence-collection
        scan-verification:
        - zf-yoke-test-evaluator-role-context
        refactor-plan-synth:
        - zf-workflow-adaptation-boundary
        - zf-project-adapter-matrix-enrichment
        - zf-refactor-plan-synth
        - zf-yoke-planner-role-context
        plan-critic:
        - zf-workflow-adaptation-boundary
        - zf-yoke-critic-role-context
        refactor-verify-bridge:
        - zf-verify-rescan-replan
        - zf-goal-closure-replan-contract
        - zf-yoke-test-evaluator-role-context
        module-parity-scan:
        - source-verification
        - zf-verify-rescan-replan
        - zf-goal-closure-replan-contract
        - zf-yoke-test-evaluator-role-context
        judge-refactor:
        - zf-goal-closure-judge-contract
        impl:
        - zf-yoke-dev-worker-role-context
        verify:
        - zf-workflow-adaptation-boundary
        - zf-project-adapter-matrix-enrichment
        - zf-yoke-test-evaluator-role-context
---
apiVersion: zaofu.dev/v1
kind: ZfConfig
metadata:
  name: sensorworkbench-new
spec:
  version: '1.0'
  project:
    name: sensorworkbench-new
    description: 'Sensor Workbench 是一个浏览器端自动驾驶多模态数据浏览、模型对比和标注审核工作台。

      它不以训练模型为首要目标，而是让开发者能快速回答：

      - 当前时刻各个传感器看到了什么。

      - 标注在不同坐标系中是否对齐。

      - 一个目标在时间序列中如何移动。

      - 模型预测与真值具体差在哪里。

      - 哪些场景适合加入训练集或回归集。'
    state_dir: .zf-sensorworkbench-new
  session:
    tmux_session: ${ZF_TMUX_SESSION:-zf-sensorworkbench-new}
  orchestrator:
    backend: codex
    model: gpt-5.6-luna
    model_reasoning_effort: high
    wake_min_interval_s: 5
  roles:
  - name: orchestrator
    instance_id: orchestrator
    role_kind: reader
    backend: codex
    model: gpt-5.6-luna
    model_reasoning_effort: high
    permission_mode: bypass
    transport: tmux
    stuck_threshold_seconds: 900
    spawn_ready_timeout_seconds: 240
    triggers:
    - dispatch.silent_stall
    - orchestrator.rework.triage.requested
    publishes:
    - orchestrator.rework.triage.recorded
    skills:
    - zf-yoke-orchestrator-role-context
    - zf-harness-state-sync
  uses:
  - flow-project-runtime/v1
  skill_sources:
  - name: zaofu-skills
    path: skills
    mode: readonly
