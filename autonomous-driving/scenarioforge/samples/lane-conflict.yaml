schema_version: scenarioforge.scenario-spec.v1
name: lane-conflict
map: {block_sequence: S, lane_count: 3, lane_width: 3.5}
actors:
  - {id: ego, role: ego, initial_state: {lane: 1, longitudinal: 10.0, speed: 10.0}, goal: {kind: lane, lane: 0}, behavior: yield}
  - {id: conflict, role: traffic, initial_state: {lane: 0, longitudinal: 12.0, speed: 10.0}, behavior: merge}
environment: {traffic_density: 0.15}
event_triggers: [{id: conflict-approach, kind: on_approach, distance: 8.0, action: set_speed_limit}]
safety: {max_speed: 18.0, minimum_headway: 2.0, collision_free: true}
tags: [lane-conflict, metadrive-only]
