schema_version: scenarioforge.scenario-spec.v1
name: intersection
map: {block_sequence: X, lane_count: 2, lane_width: 3.5}
actors:
  - {id: ego, role: ego, initial_state: {lane: 0, longitudinal: 4.0, speed: 6.0}, goal: {kind: route_progress, minimum_progress: 0.85}, behavior: cross_intersection}
  - {id: cross-traffic, role: traffic, initial_state: {lane: 1, longitudinal: 16.0, speed: 5.0}, behavior: yield}
environment: {traffic_density: 0.2}
event_triggers: [{id: intersection-time, kind: at_time, seconds: 2.0, action: spawn_traffic}]
safety: {max_speed: 16.0, minimum_headway: 1.8, collision_free: true}
tags: [intersection, metadrive-only]
