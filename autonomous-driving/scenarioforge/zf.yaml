version: '1.0'
preset: ''
project:
  name: scenarioforge-showcase-closure-v4-r3
  description: Execute one real emergency-braking scenario from authored semantics
    through regression evidence.
  workspace: .
  state_dir: .zf-scenarioforge-showcase-closure-v4-r3
  scripts:
    setup: uv sync --frozen --all-groups && npm --prefix web ci
session:
  tmux_session: zf-scenarioforge-showcase-closure-v4-r3
  tmux_layout: pane_grid
orchestrator:
  backend: codex
  model: ''
  loop:
    max_iterations: 20
    idle_exit_after: 3
  transport_timeout_s: 120.0
  max_turns: 30
  rate_limit_cooldown_s: 60.0
  wake_min_interval_s: 5.0
constraints:
  allowed_paths: []
  blocked_paths: []
  max_steps: 0
workflow:
  gan_rounds: 1
  harness_profile: baseline
  allow_unverified_candidate: false
  candidate_quality_source: task_contract_required
  impl_self_check_required: true
  orchestration:
    mode: semantic_control
    checkpoints:
    - plan_candidate
    checkpoint_policies:
      plan_candidate: shadow
    pilot_id: ''
    shadow_sample_percent: 25
    flow_policies:
      research:
        mode: exception_advisor
        checkpoints: []
        checkpoint_policies: {}
        pilot_id: ''
        shadow_sample_percent: 100
      workflow:
        mode: exception_advisor
        checkpoints: []
        checkpoint_policies: {}
        pilot_id: ''
        shadow_sample_percent: 100
    max_plan_revisions: 2
    no_progress_limit: 2
  attempt_lease_grace_s: 900.0
  event_actions: []
  rework_routing:
    issue.triage.failed: issue-triage
    integration.failed: issue-triage
    static_gate.failed: fix-lane-0
    test.failed: fix-lane-0
  kind_routes:
    issue:
      pattern_id: issue-triage
      alias: ''
      default_tier: standard
      tier_routes: {}
  execution_profiles:
    bounded-direct-v1:
      schema_version: execution-profile.v1
      strategy: direct
      continuation: turn
      collaboration: single
      access: read_only
      capability_policy: require
      limits:
        max_children: 0
        max_depth: 0
        timeout_seconds: 1800.0
        max_usage_samples: 240
        token_budget: 10000000
        cost_budget_usd: 15.0
  run_limits:
    timeout_seconds: 21600.0
    token_budget: 100000000
    cost_budget_usd: 100.0
  admission_replan:
    enabled: true
    resynth_trigger: issue.requested
  run_admission:
    version: v1
    mode: serial
    max_active_runs: 1
  task_attempt:
    version: v1
    mode: shadow
    max_attempts: 3
  stages:
  - id: issue-triage
    trigger: issue.requested
    flow_kind: issue
    topology: fanout_reader
    operation: ''
    attempt_domain: plan
    result_semantics: ''
    input_ports: []
    output_ports: []
    dependencies: []
    dependency_events: []
    dependency_failure_events: []
    dependency_barrier_id: ''
    dependency_barrier_digest: ''
    roles:
    - issue-triage
    target_ref: HEAD
    task_map: ''
    aggregate:
      mode: wait_for_all
      success_event: task_map.ready
      failure_event: issue.triage.failed
      child_success_event: issue.triage.child.completed
      child_failure_event: issue.triage.child.failed
      synth_role: plan-critic
      max_retries: 0
      review_strategy: ''
      pending_event: ''
      quorum: 0
      synth_timeout_seconds: 0
    timeout_seconds: 0
    criteria:
      instructions:
      - This is issue triage and task-map synthesis, not fix verification.
      - The reported bug or missing behavior is expected before fix; turn it into
        scoped repair tasks and regression checks.
      - Emit success when you can understand the issue and produce a machine-readable
        task_map.
      - For a complete actionable task_map, set status to passed and recommendation
        to approve; the unfixed issue and downstream implementation work are task-map
        content, not a triage-operation rejection.
      - Emit failure only when the issue/scope cannot be read or no actionable task_map
        can be produced.
      - 'Task-map hard contract: write valid JSON with top-level `schema_version`
        exactly `task-map.v1`.'
      - 'Task-map hard contract: when the workflow has a target root, include top-level
        `target_root` and keep all paths repo-relative.'
      - 'Task-map hard contract: include `shared_conventions.test_path_prefix` and
        package/scaffold conventions such as `package_root` and `packaging_file` when
        more than one task depends on them.'
      - 'Task-map hard contract: top-level `tasks` must be a non-empty array; each
        task must have a stable `task_id`, `title`, scoped `allowed_paths`, structured
        `validation.commands`, `acceptance_criteria`, and `blocked_by` (empty array
        when none).'
      - 'Task-map hard contract: when `allowed_paths` is non-empty, include `allowed_paths_reason`
        or `scope_reason` explaining the ownership boundary.'
      - 'Task-map hard contract: `allowed_paths` grants exclusive write ownership.
        No concrete path or overlapping subtree may appear in multiple tasks, even
        with `blocked_by`; coarsen tasks or assign one integration owner.'
      - 'Task-map hard contract: dependencies in `blocked_by` must reference existing
        task ids and must not point to a later wave.'
      - 'Task-map hard contract: new plans use `validation.commands[]`; each command
        has stable `id`, executable `command`, `acceptance_ids`, `owner`, `tier`,
        `deterministic`, `reusable`, and `timeout_seconds`; commands that produce
        required files also declare `producer_paths`. Keep commands independent; do
        not join them with `&&`. Legacy `verification` remains accepted only as an
        adapter.'
      - 'Task-map hard contract: downstream gates execute each canonical `command`
        exactly as stored. Never validate a rewritten or equivalent command; put escape-sensitive
        assertions in repository test/script files instead of nested `node -e` or
        `python -c` payloads.'
      - 'Task-map hard contract: acceptance entries use stable `id`, observable `statement`,
        `mandatory`, `verification_owner`, `verification_tier`, and `verification_command_ids`.
        An AC is a product outcome, not a test command or implementation step.'
      - 'Task-map hard contract: verification may read sibling-owned paths; do not
        duplicate read-only operands in `allowed_paths`. Represent each repo-relative
        path once (for example `app/tests/...`, not bare `tests/...`).'
      - 'Task-map hard contract: scaffold owners must list package metadata files
        they create, including `package.json`, `pyproject.toml`, `setup.py`, `setup.cfg`,
        `tsconfig.json`, or lockfiles.'
      - 'Plan handoff hard contract: produce a non-empty human-readable Markdown plan
        and expose it as plan_artifact_ref/plan_ref or plan_md.'
      - 'Plan handoff hard contract: produce source-index.v1 and expose source_index_ref
        or a source_index plan port; every task needs source_key, source_ref, and
        source_excerpt.'
      - 'Goal handoff hard contract: explicit mandatory goal_claims must be mapped
        through task goal_claim_ids to structured acceptance criteria and verification
        command ids; every command and acceptance criterion needs an owner and tier.'
      success_criteria: []
      output:
        required_keys: []
        required_artifacts: []
        artifact_kinds: []
      retry:
        max_attempts: 0
        backoff_seconds: 0
        on_failure: rework
    gate_profile: []
    retrigger_requires_delta: false
    synthesize_canonical_tasks: false
  - id: issue-post-verify-discovery
    trigger: flow.discovery.requested
    flow_kind: issue
    topology: fanout_reader
    operation: ''
    attempt_domain: ''
    result_semantics: ''
    input_ports: []
    output_ports: []
    dependencies: []
    dependency_events: []
    dependency_failure_events: []
    dependency_barrier_id: ''
    dependency_barrier_digest: ''
    roles:
    - flow-discovery
    target_ref: ''
    task_map: ''
    aggregate:
      mode: wait_for_all
      success_event: flow.discovery.completed
      failure_event: flow.discovery.failed
      child_success_event: flow.discovery.child.completed
      child_failure_event: flow.discovery.child.failed
      synth_role: ''
      max_retries: 0
      review_strategy: ''
      pending_event: ''
      quorum: 0
      synth_timeout_seconds: 0
    timeout_seconds: 0
    criteria:
      instructions:
      - This stage runs after implementation verification and should inspect the delivered
        candidate for residual gaps.
      - Use concrete evidence from files, tests, and prior artifacts; emit failure
        for blocking product/regression/parity gaps that still need rework.
      - 'If no blocking gaps remain, emit success with explicit zero-gap closure evidence:
        include `evidence_refs` and at least one of `test_refs`, `e2e_refs`, `demo_refs`,
        `regression_refs`, or `parity_refs` as applicable.'
      - If gaps remain, emit bounded `gap_tasks` with source refs and verification
        commands instead of a prose-only finding.
      success_criteria: []
      output:
        required_keys: []
        required_artifacts: []
        artifact_kinds: []
      retry:
        max_attempts: 0
        backoff_seconds: 0
        on_failure: rework
    gate_profile: []
    retrigger_requires_delta: false
    synthesize_canonical_tasks: false
  - id: issue-lanes-impl
    trigger: task_map.ready
    flow_kind: issue
    topology: fanout_writer_scoped
    operation: ''
    attempt_domain: ''
    result_semantics: ''
    input_ports: []
    output_ports: []
    dependencies: []
    dependency_events: []
    dependency_failure_events: []
    dependency_barrier_id: ''
    dependency_barrier_digest: ''
    roles:
    - fix-lane-0
    target_ref: ''
    task_map: ${task_map_ref}
    aggregate:
      mode: candidate_integration
      success_event: candidate.ready
      failure_event: integration.failed
      child_success_event: dev.build.done
      child_failure_event: dev.failed
      synth_role: ''
      max_retries: 1
      review_strategy: ''
      pending_event: ''
      quorum: 0
      synth_timeout_seconds: 0
    timeout_seconds: 0
    criteria:
      instructions: []
      success_criteria: []
      output:
        required_keys: []
        required_artifacts: []
        artifact_kinds: []
      retry:
        max_attempts: 0
        backoff_seconds: 0
        on_failure: rework
    gate_profile: []
    retrigger_requires_delta: false
    synthesize_canonical_tasks: true
    fanout:
      assignment:
